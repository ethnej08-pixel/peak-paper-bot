name: paper-trade

# GitHub's cron is unreliable for every-5-minute jobs (it was firing about hourly).
# So instead, one long job runs all trading day and ticks every 5 min itself (bot.py --loop).
# The crons below are just "kick-off" attempts spread over the morning and day:
#   - whichever fires first starts the loop (it waits for 9:30 ET if early)
#   - the others queue behind it (concurrency) and take over if a job hits its time limit
#   - a run that starts after the close exits in seconds
# Times are UTC and cover both EST and EDT, so no daylight-saving changes are needed.
# NOTE: needs a PUBLIC repo for unlimited free Actions minutes (~6.5 h/day of runtime).
on:
  schedule:
    - cron: "7,37 12-20 * * 1-5"
  workflow_dispatch:
    inputs:
      check:
        description: "Only test fetching prices (no trades)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: paper-trade
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 355  # GitHub's max is 360; the bot stops itself at 340
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Price check only
        if: github.event_name == 'workflow_dispatch' && inputs.check
        run: python bot.py --check
      - name: Trade all day (every 5 min)
        if: github.event_name == 'schedule' || !inputs.check
        env:
          LOOP_MINUTES: "340"
        run: |
          git config user.name "peak-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -u bot.py --loop
