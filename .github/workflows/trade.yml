name: paper-trade

# Scheduled runs are paused at the owner's request.
# Manual dispatch remains available for an explicit price check or paper-trade run.
on:
  workflow_dispatch:
    inputs:
      check:
        description: "Only test fetching prices (no trades)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: paper-trade
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 355  # GitHub's max is 360; the bot stops itself at 340
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Price check only
        if: github.event_name == 'workflow_dispatch' && inputs.check
        run: python bot.py --check
      - name: Trade all day (every 5 min)
        if: github.event_name == 'schedule' || !inputs.check
        env:
          LOOP_MINUTES: "340"
        run: |
          git config user.name "peak-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -u bot.py --loop
