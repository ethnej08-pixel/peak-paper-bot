name: paper-trade

on:
  schedule:
    # Every 5 min during US market hours, Mon-Fri (times are UTC; EST = UTC-5).
    # 14:30-20:55 UTC = 9:30 AM-3:55 PM EST. After DST starts in March, shift these back one hour.
    - cron: "30-59/5 14 * * 1-5"
    - cron: "*/5 15-20 * * 1-5"
  workflow_dispatch:
    inputs:
      check:
        description: "Only test fetching prices (no trades)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: paper-trade
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Price check only
        if: github.event_name == 'workflow_dispatch' && inputs.check
        run: python bot.py --check
      - name: Trade tick
        if: github.event_name == 'schedule' || !inputs.check
        run: python bot.py --cloud
      - name: Save results
        if: github.event_name == 'schedule' || !inputs.check
        run: |
          git config user.name "peak-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json RESULTS.md
          git diff --cached --quiet || git commit -m "tick $(date -u +%H:%M)"
          git push
